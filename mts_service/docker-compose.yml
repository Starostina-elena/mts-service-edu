services:
  db:
    image: postgres:15
    container_name: mts_service_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-mts_db}
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-mts_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    command: ["postgres", "-c", "log_statement=all", "-c", "log_min_messages=DEBUG3"]

  balance_db:
    image: postgres:15
    container_name: mts_service_balance_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB_BALANCE:-mts_balance}
    volumes:
      - balance_db_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB_BALANCE:-mts_balance}"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile.local
    depends_on:
      db:
        condition: service_healthy
      balance_db:
        condition: service_healthy
      kafka:
        condition: service_started
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-mts_db}?stringtype=unspecified
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      SPRING_DATASOURCE_BALANCE_URL: jdbc:postgresql://balance_db:5432/${POSTGRES_DB_BALANCE:-mts_balance}?stringtype=unspecified
      SPRING_DATASOURCE_BALANCE_USERNAME: ${POSTGRES_USER:-postgres}
      SPRING_DATASOURCE_BALANCE_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-local}
      ELASTICSEARCH_URL: http://elasticsearch:9200
      TAIGA_API_URL: http://taiga-back:8000
      TAIGA_PROJECT: applications
      TAIGA_USER: manager
      TAIGA_PASSWORD: managerpass
      TAIGA_TOKEN: ${TAIGA_TOKEN:-}
      KAFKA_BOOTSTRAP: kafka:9092
      CONSUMERS_NOTIFICATIONS_ENABLED: "false"
      CONSUMERS_TAIGA_ENABLED: "true"
      APP_CAMUNDA_DEPLOY_PROCESSES: "true"
    ports:
      - "8080:8080"
    restart: unless-stopped
    networks:
      - default
      - taiga

  notification_worker:
    build:
      context: .
      dockerfile: Dockerfile.local
    depends_on:
      kafka:
        condition: service_started
      db:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-local}
      KAFKA_BOOTSTRAP: kafka:9092
      CONSUMERS_NOTIFICATIONS_ENABLED: "true"
      CONSUMERS_TAIGA_ENABLED: "false"
      APP_CAMUNDA_DEPLOY_PROCESSES: "false"
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-mts_db}?stringtype=unspecified
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      SPRING_DATASOURCE_BALANCE_URL: jdbc:postgresql://balance_db:5432/${POSTGRES_DB_BALANCE:-mts_balance}?stringtype=unspecified
      SPRING_DATASOURCE_BALANCE_USERNAME: ${POSTGRES_USER:-postgres}
      SPRING_DATASOURCE_BALANCE_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    restart: unless-stopped
    networks:
      - default

  zookeeper:
    image: "confluentinc/cp-zookeeper:7.4.0"
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"

  kafka:
    image: "confluentinc/cp-kafka:7.4.0"
    depends_on:
      - zookeeper
      - db
    ports:
      - "9092:9092"
      - "29092:29092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: 'zookeeper:2181'
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,PLAINTEXT_HOST://0.0.0.0:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'true'
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
    networks:
      - default

