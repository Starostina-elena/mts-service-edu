services:
  db:
    image: postgres:15
    container_name: mts_service_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-mts_db}
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-mts_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    command: ["postgres", "-c", "log_statement=all", "-c", "log_min_messages=DEBUG3"]

  balance_db:
    image: postgres:15
    container_name: mts_service_balance_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB_BALANCE:-mts_balance}
    volumes:
      - balance_db_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB_BALANCE:-mts_balance}"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: mts_service_app
    depends_on:
      db:
        condition: service_healthy
      balance_db:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-mts_db}?stringtype=unspecified
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      SPRING_DATASOURCE_BALANCE_URL: jdbc:postgresql://balance_db:5432/${POSTGRES_DB_BALANCE:-mts_balance}?stringtype=unspecified
      SPRING_DATASOURCE_BALANCE_USERNAME: ${POSTGRES_USER:-postgres}
      SPRING_DATASOURCE_BALANCE_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-local}
      ELASTICSEARCH_URL: http://elasticsearch:9200
    ports:
      - "8080:8080"
    restart: unless-stopped

  taiga-db:
    image: postgres:13-alpine
    container_name: mts_service_taiga_db
    environment:
      - POSTGRES_DB=taiga
      - POSTGRES_USER=taiga
      - POSTGRES_PASSWORD=taiga
    volumes:
      - taiga_db_data:/var/lib/postgresql/data
      - ./docker/taiga/init-taiga.sh:/docker-entrypoint-initdb.d/init-taiga.sh
    restart: unless-stopped

  taiga-rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: mts_service_taiga_rabbitmq
    hostname: rabbitmq
    environment:
      - RABBITMQ_DEFAULT_USER=taiga
      - RABBITMQ_DEFAULT_VHOST=taiga
      - RABBITMQ_DEFAULT_PASS=taiga
    ports:
      - "15672:15672"
    volumes:
      - taiga_rabbitmq_data:/var/lib/rabbitmq
    restart: unless-stopped

  taiga-back:
    image: taigaio/taiga-back:latest
    container_name: mts_service_taiga_back
    environment:
      - TAIGA_SECRET_KEY=taigasecretkey
      - TAIGA_SITES_DOMAIN=localhost
      - TAIGA_SITES_SCHEME=http
      - TAIGA_SUBPATH=
      - POSTGRES_DB=taiga
      - POSTGRES_USER=taiga
      - POSTGRES_PASSWORD=taiga
      - POSTGRES_HOST=taiga-db
      - POSTGRES_PORT=5432
      - RABBITMQ_USER=taiga
      - RABBITMQ_PASS=taiga
      - RABBITMQ_VHOST=taiga
      - RABBITMQ_HOST=taiga-rabbitmq
      - RABBITMQ_PORT=5672
      - DEFAULT_FROM_EMAIL=taiga@example.com
      - SERVER_EMAIL=taiga@example.com
      - EMAIL_USE_TLS=False
      - EMAIL_HOST=localhost
      - EMAIL_PORT=25
      - FORCE_HTTPS=False
      - ALLOWED_HOSTS=localhost,127.0.0.1,taiga-back
    ports:
      - "8000:8000"
    depends_on:
      - taiga-db
      - taiga-rabbitmq
    restart: unless-stopped

  taiga-events:
    image: taigaio/taiga-events:latest
    container_name: mts_service_taiga_events
    environment:
      - TAIGA_SECRET_KEY=taigasecretkey
      - RABBITMQ_USER=taiga
      - RABBITMQ_PASS=taiga
      - RABBITMQ_VHOST=taiga
      - RABBITMQ_HOST=taiga-rabbitmq
    ports:
      - "8888:8888"
    depends_on:
      - taiga-rabbitmq
    restart: unless-stopped

  taiga-front:
    image: taigaio/taiga-front:latest
    container_name: mts_service_taiga_front
    environment:
      - TAIGA_URL=http://localhost:8000
      - TAIGA_WEBSOCKETS_URL=ws://localhost:8000
      - TAIGA_SUBPATH=
    ports:
      - "9000:80"
    depends_on:
      - taiga-back
    restart: unless-stopped


