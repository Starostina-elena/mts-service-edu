version: '3.8'

services:
  postgres:
    image: postgres:13
    environment:
      POSTGRES_USER: taiga
      POSTGRES_PASSWORD: taiga
      POSTGRES_DB: taiga
    volumes:
      - ./postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "taiga"]
      interval: 10s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:3-management
    environment:
      RABBITMQ_DEFAULT_USER: taiga
      RABBITMQ_DEFAULT_PASS: taiga
    ports:
      - "15672:15672"
      - "5672:5672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:6
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  taiga-back:
    image: taigaio/taiga-back:latest
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      TAIGA_SECRET_KEY: "change-me-secret"
      TAIGA_DEBUG: "False"
      TAIGA_HOST: "taiga.local"
      TAIGA_SITE_NAME: "MTS Taiga"

      POSTGRES_DB: taiga
      POSTGRES_USER: taiga
      POSTGRES_PASSWORD: taiga
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432

      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USER: taiga
      RABBITMQ_PASSWORD: taiga

      REDIS_HOST: redis
      REDIS_PORT: 6379

      TAIGA_FRONTEND_URL: http://localhost:9000
    volumes:
      - ./taiga-back/media:/taiga/media
      - ./create-manager.sh:/taiga/create-manager.sh
    ports:
      - "8000:8000"
    command: /bin/sh -c "python3 manage.py migrate --noinput && /taiga/create-manager.sh || true && python3 manage.py collectstatic --noinput && gunicorn -b 0.0.0.0:8000 taiga.wsgi"

  taiga-front:
    image: taigaio/taiga-front:latest
    depends_on:
      - taiga-back
    environment:
      TAIGA_BACK_URL: "http://taiga-back:8000"
    ports:
      - "9000:80"
    volumes:
      - ./taiga-front/conf:/taiga-front/conf:ro

  taiga-events:
    image: taigaio/taiga-events:latest
    depends_on:
      - taiga-back
      - rabbitmq
    environment:
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USER: taiga
      RABBITMQ_PASSWORD: taiga
      TAIGA_HOST: taiga-back
      TAIGA_PORT: 8000
    ports:
      - "8888:8888"

volumes:
  # data stored in project folder for simplicity
  postgres-data:
    driver: local

