spring.application.name=mts_service

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/mts_db?sslmode=disable&stringtype=unspecified}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}

spring.datasource.balance.url=${SPRING_DATASOURCE_BALANCE_URL:${SPRING_DATASOURCE_ORACLE_URL:jdbc:postgresql://localhost:5433/balance_db?sslmode=disable&stringtype=unspecified}}
spring.datasource.balance.username=${SPRING_DATASOURCE_BALANCE_USERNAME:${SPRING_DATASOURCE_ORACLE_USERNAME:balance_user}}
spring.datasource.balance.password=${SPRING_DATASOURCE_BALANCE_PASSWORD:${SPRING_DATASOURCE_ORACLE_PASSWORD:balance_pass}}

spring.docker.compose.enabled=false

spring.jpa.hibernate.ddl-auto=none
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

spring.jpa.hibernate.naming.implicit-strategy=org.springframework.boot.orm.jpa.hibernate.SpringImplicitNamingStrategy
spring.jpa.hibernate.naming.physical-strategy=org.springframework.boot.orm.jpa.hibernate.SpringPhysicalNamingStrategy

payments.base-url=https://payments.example.com/mock-pay

# Pagination
app.pagination.default-limit=20

# Currency
app.currency.code=RUB

# Mock authentication
app.auth.mock-header=X-Mock-User
app.auth.default-user=mock@local
app.auth.manager-user=manager@local
app.auth.admin-user=admin@local
app.auth.xml-file=users.xml

# User ID header
app.auth.user-id-header=X-User-Id

# Security public endpoints
app.security.public-post-endpoints=/api/users
app.security.public-endpoints=/error

# JAAS users XML file path (writable, on filesystem)
app.security.users-xml-path=./data/users.xml

# Elasticsearch
spring.elasticsearch.uris=${ELASTICSEARCH_URL:http://localhost:9200}
spring.elasticsearch.username=${ELASTICSEARCH_USERNAME:}
spring.elasticsearch.password=${ELASTICSEARCH_PASSWORD:}

# Enable indexing of tariffs on application start
app.search.index-on-start=false

# JTA / Narayana
spring.jta.enabled=true

server.port=${SERVER_PORT:8080}
